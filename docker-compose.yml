services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dinotalk_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: dinotalk
      POSTGRES_PASSWORD: dinotalk_secret_password
      POSTGRES_DB: dinotalk_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata:
